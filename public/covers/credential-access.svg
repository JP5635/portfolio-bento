<svg xmlns="http://www.w3.org/2000/svg" width="480" height="286" viewBox="0 0 480 286" role="img" aria-labelledby="title desc"><title id="title">Retryable cloud operations</title><desc id="desc">Original educational transactional-outbox diagram. PostgreSQL commits application state and an outbox row atomically. A worker delivers an external operation with retries; the receiver deduplicates using a stable operation identifier.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#507f78"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="480" height="286" fill="#f2f3ef"/><rect width="480" height="7" fill="#193147"/><text x="28" y="41" font-size="10.5" fill="#627681" font-weight="500" letter-spacing="1.1">POSTGRESQL / TRANSACTIONAL OUTBOX</text><text x="28" y="77" font-size="24" fill="#193147" font-weight="600">Retryable cloud operations</text><text x="28" y="108" font-size="8.5" fill="#507f78" font-weight="600" letter-spacing="1.2">PURPOSE</text><text x="28" y="125" font-size="11.3" fill="#627681" font-weight="400">Commit intent before making an external call.</text><rect x="28" y="154" width="148" height="60" rx="5" fill="#193147" stroke="#193147"/><text x="102.0" y="176" font-size="12.5" fill="#ffffff" font-weight="500" text-anchor="middle">State + outbox</text><text x="102.0" y="193" font-size="9.5" fill="#dce8e7" font-weight="400" text-anchor="middle">one DB transaction</text><path d="M176 184H200" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="203" y="154" width="104" height="60" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="255.0" y="176" font-size="12.5" fill="#193147" font-weight="500" text-anchor="middle">Worker</text><text x="255.0" y="193" font-size="9.5" fill="#627681" font-weight="400" text-anchor="middle">claim &amp; deliver</text><path d="M307 184H331" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="334" y="154" width="118" height="60" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="393.0" y="176" font-size="12.5" fill="#193147" font-weight="500" text-anchor="middle">External API</text><text x="393.0" y="193" font-size="9.5" fill="#627681" font-weight="400" text-anchor="middle">deduplicate by ID</text><path d="M393 214V237H255V217" fill="none" stroke="#507f78" stroke-width="1.7" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="326" y="248" font-size="9.5" fill="#507f78" font-weight="500" text-anchor="middle">retry with a stable operation ID</text><text x="28" y="264" font-size="9.5" fill="#627681" font-weight="400">At-least-once delivery requires idempotent handling.</text></g></svg>
