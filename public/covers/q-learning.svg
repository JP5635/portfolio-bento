<svg xmlns="http://www.w3.org/2000/svg" width="480" height="286" viewBox="0 0 480 286" role="img" aria-labelledby="title desc"><title id="title">Learning through feedback</title><desc id="desc">A simplified tabular Q-learning feedback loop linking observation, action, reward and an update of Q values. This is a method illustration, not measured performance.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#507f78"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="480" height="286" fill="#f2f3ef"/><rect width="480" height="7" fill="#193147"/><text x="28" y="41" font-size="10.5" fill="#627681" font-weight="500" letter-spacing="1.3">REINFORCEMENT LEARNING / EXPLAINER</text><text x="28" y="77" font-size="25" fill="#193147" font-weight="600" >Learning through feedback</text><rect x="28" y="133" width="106" height="47" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="81.0" y="161.0" font-size="13" fill="#193147" font-weight="500" text-anchor="middle" >Observe</text><path d="M134 156H177" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="180" y="133" width="120" height="47" rx="5" fill="#193147" stroke="#193147"/><text x="240.0" y="161.0" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle" >Choose action</text><path d="M300 156H343" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="346" y="133" width="106" height="47" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="399.0" y="161.0" font-size="13" fill="#193147" font-weight="500" text-anchor="middle" >Reward</text><path d="M399 180V220H82V180" fill="none" stroke="#507f78" stroke-width="1.7" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="240" y="214" font-size="13" fill="#507f78" font-weight="500" text-anchor="middle" >Update Q(s, a)</text><text x="28" y="264" font-size="10" fill="#627681" font-weight="400" >Method diagram · State, action, reward, update.</text></g></svg>