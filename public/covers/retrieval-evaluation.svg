<svg xmlns="http://www.w3.org/2000/svg" width="480" height="286" viewBox="0 0 480 286" role="img" aria-labelledby="title desc"><title id="title">Measure before tuning.</title><desc id="desc">A retrieval evaluation loop: submit a query, embed it, retrieve candidates, then check whether the expected source appears in the top five. Language alignment between embedding and query is the debugging focus.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#507f78"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="480" height="286" fill="#f2f3ef"/><rect width="480" height="7" fill="#193147"/><text x="28" y="41" font-size="10.5" fill="#627681" font-weight="500" letter-spacing="1.3">ENGINEERING NOTE / RETRIEVAL</text><text x="28" y="77" font-size="25" fill="#193147" font-weight="600" >Measure before tuning.</text><rect x="28" y="129" width="106" height="51" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="81.0" y="159.0" font-size="13" fill="#193147" font-weight="500" text-anchor="middle" >Query</text><path d="M134 154H177" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="180" y="129" width="120" height="51" rx="5" fill="#193147" stroke="#193147"/><text x="240.0" y="159.0" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle" >Embed</text><path d="M300 154H343" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="346" y="129" width="106" height="51" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="399.0" y="159.0" font-size="13" fill="#193147" font-weight="500" text-anchor="middle" >Retrieve</text><path d="M399 180V211H82V180" fill="none" stroke="#507f78" stroke-width="1.7" stroke-dasharray="4 4"/><text x="240" y="235" font-size="12" fill="#507f78" font-weight="500" text-anchor="middle" >Check expected document in the top 5</text><text x="28" y="264" font-size="10" fill="#627681" font-weight="400" >Title-based self-retrieval · A narrow diagnostic test.</text></g></svg>