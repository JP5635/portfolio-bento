<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Resume interrupted uploads</title><desc id="desc">Original educational S3 multipart-upload diagram. Persist an upload identifier and a manifest of part numbers and ETags, reconcile remote parts before resuming, complete with the part list, then verify object size and checksum.</desc><rect width="1200" height="630" fill="#f2f3ef"/><g transform="translate(96 15) scale(2.1)"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#507f78"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="480" height="286" fill="#f2f3ef"/><rect width="480" height="7" fill="#193147"/><text x="28" y="41" font-size="10.5" fill="#627681" font-weight="500" letter-spacing="1.1">S3 / MULTIPART UPLOADS</text><text x="28" y="77" font-size="24" fill="#193147" font-weight="600">Resume interrupted uploads</text><text x="28" y="108" font-size="8.5" fill="#507f78" font-weight="600" letter-spacing="1.2">PURPOSE</text><text x="28" y="125" font-size="11.3" fill="#627681" font-weight="400">Reconcile uploaded parts before completing an object.</text><rect x="28" y="164" width="92" height="52" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="74.0" y="186" font-size="12.5" fill="#193147" font-weight="500" text-anchor="middle">Parts</text><text x="74.0" y="203" font-size="9.5" fill="#627681" font-weight="400" text-anchor="middle">upload ID</text><path d="M120 190H135" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="138" y="164" width="92" height="52" rx="5" fill="#193147" stroke="#193147"/><text x="184.0" y="186" font-size="12.5" fill="#ffffff" font-weight="500" text-anchor="middle">Manifest</text><text x="184.0" y="203" font-size="9.5" fill="#dce8e7" font-weight="400" text-anchor="middle">part IDs + ETags</text><path d="M230 190H245" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="248" y="164" width="92" height="52" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="294.0" y="186" font-size="12.5" fill="#193147" font-weight="500" text-anchor="middle">Complete</text><text x="294.0" y="203" font-size="9.5" fill="#627681" font-weight="400" text-anchor="middle">commit the list</text><path d="M340 190H355" fill="none" stroke="#507f78" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="358" y="164" width="94" height="52" rx="5" fill="#ffffff" stroke="#bdcbcf"/><text x="405.0" y="186" font-size="12.5" fill="#193147" font-weight="500" text-anchor="middle">Verify</text><text x="405.0" y="203" font-size="9.5" fill="#627681" font-weight="400" text-anchor="middle">size + checksum</text><path d="M184 217V237H74V219" fill="none" stroke="#507f78" stroke-width="1.7" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="307" y="241" font-size="9" fill="#507f78" font-weight="500" text-anchor="middle">ListParts → reconcile → upload missing parts</text><text x="28" y="264" font-size="9.5" fill="#627681" font-weight="400">Transfer progress, completion and integrity are separate checks.</text></g></g></svg>
